; エメラルド日本語版（BPEJ）用の定義（英語版 Rom_BPEE.ini と同じ目印方式。日本語版の ROM で確認）
; 改造版（pokeemerald をもとにビルドし直したもの）ではプログラムの位置もずれるため、
; 決まった場所のポインタ（*0x...）ではなく、目印のバイト列を探す書き方（"目印", 目印の直後からの距離）を使う。
; auto は、エディタが ROM の中身から求める（人物の絵の表・タイルセットの先頭と見出しの大きさ・件数）。
; 文字表は日本語（charmap.tbl）。表の場所は目印のバイト列と auto で求める。

; マップ
MAP_BANK_TABLE_OFFSET = "80180068890B091808687047", 0x0
MAP_TERRAIN_ID_TABLE_OFFSET = "3989000918086802BC084700", 0x1
MAP_TERRAIN_ID_COUNT = auto
; マップ名（gRegionMapEntries: 1 件 8 バイト = x, y, 幅, 高さ, 名前へのポインタ）
MAP_NAME_TABLE_OFFSET = "C078288030BC01BC00470000", 0x0
MAP_NAME_FIRST_INDEX = 0x0
MAP_NAME_COUNT = auto
MAP_NAME_ENTRY_SIZE = 8
MAP_NAME_POINTER_OFFSET = 4
; タイルセット（見出しの先頭 24 バイトの並びは元の ROM と同じ。改造版では見出しが大きいことがある）
TILESET_INDEX_START_OFFSET = auto
TILESET_HEADER_SIZE = auto
; ブロック 1 つのバイト数（元の ROM は 16 = 2 層。pokeemerald-expansion の 3 層ブロックの改造版は 24）
BLOCK_DATA_SIZE = auto
; 人物の絵の番号が 2 バイト（+2〜+3）か（pokeemerald-expansion の改造版は 1。元の ROM は 0）
OBJECT_EVENT_GFX_16BIT = auto

; 歩行グラフィック
OVERWORLD_DATA_TABLE_OFFSET = auto
OVERWORLD_PALETTE_TABLE_OFFSET = "21F801BC00470000FF110000", 0x0

; ポケモンのアイコンと名前（ROM 先頭の情報表。FR と同じ位置）
ICON_IMAGE_TABLE_OFFSET = *0x00000138
ICON_PALETTE_ID_TABLE_OFFSET = *0x0000013C
ICON_PALETTE_TABLE_OFFSET = *0x00000140
ICON_PALETTE_COUNT = 3
POKEMON_NAME_OFFSET = *0x00000144
; 名前 1 匹ぶんの長さ（ROM の中身で確かめる）と匹数（auto = 名前の表とわざ名の表の間の大きさから数える）
POKEMON_NAME_LENGTH = 0x6
TOTAL_POKEMON_COUNT = auto
; わざ・とくせいの名前（長さは ROM の中身で確かめる。件数は元のゲームの値で、テーブル情報の画面だけが使う）
MOVE_NAME_TABLE_OFFSET = *0x00000148
MOVE_NAME_LENGTH = 0x8
TOTAL_MOVE_COUNT = 355
ABILITY_NAME_TABLE_OFFSET = *0x000001C0
ABILITY_NAME_LENGTH = 0x8
TOTAL_ABILITY_COUNT = 78

; 道具のデータ（隠しアイテムの看板に道具の名前を出すために使う。1 件の大きさは ROM の中身で確かめる）
ITEM_INFO_TABLE_OFFSET = *0x000001C8

; 野生ポケモン（エメラルドは時間帯なし）
WILD_ENCOUNTER_TABLE_DAY_OFFSET = "0348048009E00000FFFF0000", 0x0
ENABLE_DNS_WILD_ENCOUNTER = False

; タウンマップ（region_map.c）。絵は 8bpp・LZ、並べ方はアフィン BG 64×64（1 バイト）・LZ、パレットは絵の直前 0x40 バイト（0x70 番から）
; 場所の表（28×15）は、マップ名の表の x・y・幅・高さから作った期待表と照合して探す。無い改造版（Spades など）は長方形から求める
REGION_MAP_GFX_OFFSET = "06480168081C8330007800280AD0081C8030007802490022009220E0", 0x4
REGION_MAP_TILEMAP_OFFSET_0 = auto
REGION_MAP_PALETTE_OFFSET = auto
REGION_MAP_PALETTE_BASE = 0x70
REGION_MAP_SECTION_OFFSET_0 = auto
REGION_MAP_SECTION_NONE = auto

; 空き領域を探し始める位置（auto = ROM の末尾に続く 0xFF の並びの先頭。点検の修復などで使う）
FREE_SPACE_FINDER_OFFSET = auto
